climate:
  - platform: climate_template
    name: Virtual Office Climate
    unique_id: virtual_office_climate
    modes:
      - "off"
      - "heat"
      - "cool"
      - "auto"
    min_temp: 64
    max_temp: 86
    
    current_temperature_template: "{{ states('sensor.office_motion_air_temperature_2') }}"
    target_temperature_template: "{{ states('input_number.mxz_home_office_target') }}"
    fan_mode_template: "{{ state_attr('climate.office_home_office', 'fan_mode') }}"
    
    # 1. READ STATE: spoof 'auto' when boolean is on but physical AC is off
    hvac_mode_template: >
      {% if is_state('input_boolean.mxz_home_office_enable', 'off') %}
        off
      {% elif is_state('climate.office_home_office', 'off') %}
        auto
      {% else %}
        {{ states('climate.office_home_office') }}
      {% endif %}

    set_temperature:
      - service: input_number.set_value
        target:
          entity_id: input_number.mxz_home_office_target
        data:
          value: "{{ temperature }}"
          
   # 2. WRITE STATE: Standard mode passing
    set_hvac_mode:
      - choose:
          - conditions: "{{ hvac_mode == 'off' }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.mxz_home_office_enable
        default:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.mxz_home_office_enable
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.office_home_office
            data:
              hvac_mode: "{{ hvac_mode }}"