# One block per room, using the same entities as the room's slot in the automation.
# A dual-setpoint room has heat_to and cool_to instead of target.
template:
  - use_blueprint:
      path: mikepell007/mxz_room_climate.yaml
      input:
        head: climate.office_home_office
        sensor: sensor.office_motion_air_temperature_2
        enable: input_boolean.mxz_home_office_enable
        target: input_number.mxz_home_office_target
        # online: binary_sensor.office_head_ping   # optional: the head's Ping sensor
        # open: binary_sensor.office_openings      # optional: same as the room's slot
        # For an occupancy sensor, set this too. The automation's Invert checkbox
        # doesn't carry over, so without it the icon shows an open window while
        # the room is occupied.
        # open_invert: true
    name: Virtual Office Climate
    unique_id: virtual_office_climate
