# The climate card with a row of status chips above it. Each chip shows only while
# its condition holds, so the row is empty when all is well. Use the same sensors
# as the room's block in configuration_card.yaml, and delete chips you don't need:
# keep the doors and windows chip or the empty room chip, matching the room's
# open_invert. The chips follow the sensors straight away; the automation waits its
# open and close delays before it stops or restarts the head.
type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    alignment: end
    chips:
      - type: conditional
        conditions:
          - entity: binary_sensor.office_head_ping
            state: "off"
        chip:
          type: template
          entity: binary_sensor.office_head_ping
          icon: mdi:wifi-off
          icon_color: red
          content: Head offline
      - type: conditional
        conditions:
          - entity: binary_sensor.office_openings
            state: "on"
        chip:
          type: template
          entity: binary_sensor.office_openings
          icon: mdi:window-open-variant
          icon_color: orange
          content: Window open
      - type: conditional
        conditions:
          - entity: binary_sensor.office_occupancy
            state: "off"
        chip:
          type: template
          entity: binary_sensor.office_occupancy
          icon: mdi:account-off
          icon_color: grey
          content: Room empty
  # The same card as mushroom-climate-card.yaml
  - type: custom:mushroom-climate-card
    entity: climate.virtual_office_climate
    show_temperature_control: true
    # off/auto drive the room's enable boolean (see configuration_card.yaml)
    hvac_modes:
      - "off"
      - "auto"
