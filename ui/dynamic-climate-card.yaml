---
# Dynamic Climate Card for MXZ Coordinator
# This card automatically detects whether a room uses single or dual setpoint mode
type: custom:mushroom-climate-card
entity: climate.virtual_office_climate
show_temperature_control: true
collapsible_controls: true
tap_action:
  action: call-service
  service: input_boolean.toggle
  target:
    entity_id: input_boolean.mxz_home_office_enable

# This card will be enhanced to show either single or dual temperature controls
# based on the room's configuration in the blueprint