blueprint:
  name: MXZ room thermostat
  description: >-
    A thermostat entity for one room of the MXZ Coordinator, for dashboard cards.
    Its off and auto modes turn the room's enable off and on, and its temperature
    sets the room's target. The coordinator still commands the head. Pick the same
    entities as the room's slot in the automation: a Target, or Heat to and Cool to.
    Its icon can show a head that's offline, an open door or window, or an empty
    room.
  domain: template
  source_url: https://github.com/mikepell007/mxz_coordinator_blueprint/blob/main/blueprints/template/mxz_room_climate.yaml
  input:
    head:
      name: Head
      selector:
        entity:
          domain: climate
    sensor:
      name: Temperature sensor
      selector:
        entity:
          domain: sensor
    enable:
      name: Enable
      selector:
        entity:
          domain: input_boolean
    target:
      name: Target
      description: Leave blank for a dual-setpoint room.
      default: ""
      selector:
        entity:
          domain: input_number
    heat_to:
      name: Heat to
      description: Dual-setpoint rooms only.
      default: ""
      selector:
        entity:
          domain: input_number
    cool_to:
      name: Cool to
      description: Dual-setpoint rooms only.
      default: ""
      selector:
        entity:
          domain: input_number
    min_gap:
      name: Least gap between heat to and cool to
      description: >-
        Dual-setpoint rooms only. Changing one side moves the other if it would
        come closer than this. Keep it at or above the same setting in the
        automation, which makes a room with a narrower pair ask for nothing.
      default: 2.0
      selector:
        number: {min: 0.5, max: 10, step: 0.5, unit_of_measurement: "°"}
    online:
      name: Head online sensor
      description: >-
        Optional. A binary_sensor that is on while the head can be reached, such as
        a Ping sensor for its Wi-Fi adapter. While it's off, the thermostat's icon
        is a Wi-Fi-off symbol. The coordinator doesn't use it.
      default: ""
      selector:
        entity:
          domain: binary_sensor
    open:
      name: Doors and windows
      description: >-
        Optional. The same binary_sensor as the room's doors and windows in the
        automation. While it's on, the icon is an open window. It follows the
        sensor straight away; the automation waits its open delay before stopping
        the head.
      default: ""
      selector:
        entity:
          domain: binary_sensor
    open_invert:
      name: Invert doors and windows
      description: >-
        Match the automation's Invert setting for this room: for an occupancy
        sensor, the icon shows an empty room while it's off.
      default: false
      selector:
        boolean:

variables:
  head: !input head
  sensor: !input sensor
  enable: !input enable
  target: !input target
  heat_to: !input heat_to
  cool_to: !input cool_to
  min_gap: !input min_gap
  online: !input online
  open: !input open
  open_invert: !input open_invert

climate:
  hvac_modes: "{{ ['off', 'auto'] }}"
  min_temperature: 64
  max_temperature: 86

  # Status for cards: an icon, and room_status. Offline comes first, since a head
  # that can't be reached won't act on the rest. Unknown or unavailable sensors
  # count as neither state, as in the automation. Both templates work it out, so
  # the icon never lags the attribute.
  icon: >-
    {%- if online and is_state(online, 'off') -%}mdi:wifi-off
    {%- elif open and is_state(open, 'off' if open_invert else 'on') -%}
      {{- 'mdi:account-off' if open_invert else 'mdi:window-open-variant' -}}
    {%- else -%}mdi:thermostat
    {%- endif -%}
  attributes:
    room_status: >-
      {%- if online and is_state(online, 'off') -%}offline
      {%- elif open and is_state(open, 'off' if open_invert else 'on') -%}
        {{- 'unoccupied' if open_invert else 'open' -}}
      {%- else -%}ok
      {%- endif -%}
    # true/false, or none without a sensor or while it's unknown or unavailable
    head_online: "{{ {'on': true, 'off': false}.get(states(online)) if online else none }}"

  # READ STATE: the mode is the room's enable; the action shows what the head is doing
  hvac_mode: "{{ 'auto' if is_state(enable, 'on') else 'off' }}"
  hvac_action: >
    {% if is_state(enable, 'on') %}
      {{ {'heat': 'heating', 'cool': 'cooling', 'dry': 'drying'}.get(states(head), 'idle') }}
    {% else %}
      off
    {% endif %}
  current_temperature: "{{ states(sensor) | float(none) }}"
  target_temperature: "{{ states(target) | float(none) if target else none }}"
  target_temperature_low: "{{ states(heat_to) | float(none) if heat_to else none }}"
  target_temperature_high: "{{ states(cool_to) | float(none) if cool_to else none }}"

  # WRITE STATE: only the helpers; the coordinator commands the head
  set_hvac_mode:
    - action: "input_boolean.turn_{{ 'off' if hvac_mode == 'off' else 'on' }}"
      target:
        entity_id: "{{ enable }}"
  set_temperature:
    - if: "{{ target != '' }}"
      then:
        - action: input_number.set_value
          target:
            entity_id: "{{ target }}"
          data:
            value: "{{ temperature }}"
      else:
        # The side that moved wins and pushes the other, and the limits hold it
        # back if the other side has no room left.
        - variables:
            low_now: "{{ states(heat_to) | float(0) }}"
            high_now: "{{ states(cool_to) | float(0) }}"
            want_low: "{{ target_temp_low | float(low_now) }}"
            want_high: "{{ target_temp_high | float(high_now) }}"
            range_min: "{{ this.attributes.min_temp }}"
            range_max: "{{ this.attributes.max_temp }}"
            high_max: "{{ [range_max, state_attr(cool_to, 'max') | float(range_max)] | min }}"
            low_min: "{{ [range_min, state_attr(heat_to, 'min') | float(range_min)] | max }}"
            low_max: "{{ [high_max - min_gap, state_attr(heat_to, 'max') | float(range_max)] | min }}"
            high_min: "{{ [low_min + min_gap, state_attr(cool_to, 'min') | float(range_min)] | max }}"
            high_moved: "{{ (want_high - high_now) | abs > 0.001 and (want_low - low_now) | abs <= 0.001 }}"
            new_high: >-
              {{ [[want_high, high_min] | max, high_max] | min if high_moved
                 else [[want_high, [[want_low, low_min] | max, low_max] | min + min_gap] | max, high_max] | min }}
            new_low: "{{ [[want_low, new_high - min_gap] | min, low_min] | max }}"
        # Widen before narrowing, so the automation never sees a pair that's too close.
        - repeat:
            for_each: >-
              {{ [[cool_to, new_high], [heat_to, new_low]] if new_high > high_now
                 else [[heat_to, new_low], [cool_to, new_high]] }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: "{{ repeat.item[0] }}"
                data:
                  value: "{{ repeat.item[1] }}"
