              domain: binary_sensor
    control:
      name: Coordinator
      icon: mdi:hvac
      input:
        coordinator_enable:
          name: Coordinator enable
          description: Off hands the heads back; they keep their last state.
          selector:
            entity:
              domain: input_boolean
        mode_helper:
          name: Shared mode helper
          description: An input_select with the options heat and cool.
          selector:
            entity:
              domain: input_select
    comfort:
      name: Comfort
      icon: mdi:thermometer
      input:
        drift:
          name: Allowed drift
          description: How far a satisfied room coasts before it runs again.
          default: 1.0
          selector:
            number: {min: 0.5, max: 5, step: 0.5, unit_of_measurement: "°"}
        demand_threshold:
          name: Mode switch threshold
          description: How far off target a room must be to ask for heat or cool.
          default: 3.0
          selector:
            number: {min: 0.5, max: 10, step: 0.5, unit_of_measurement: "°"}
        dual_min_gap:
          name: Least gap between heat to and cool to
          description: >-
            A dual-setpoint room whose Cool to is less than this above its Heat to
            asks for nothing until it's fixed. 2 for °F, 1 for °C.
          default: 2.0
          selector:
            number: {min: 0.5, max: 10, step: 0.5, unit_of_measurement: "°"}
        min_switch_seconds:
          name: Minimum time between mode switches
          default: 600
          selector:
            number: {min: 0, max: 7200, step: 60, unit_of_measurement: s}
        resting_mode:
          name: Resting mode
          description: The mode to settle in when no room is asking.
          default: last
          selector:
            select:
              options:
                - {label: Keep the last mode, value: last}
                - {label: Heat, value: heat}
                - {label: Cool, value: cool}
    idle:
      name: Idle and setpoints
      icon: mdi:fan-off
      collapsed: true
      input:
        idle_action:
          name: When a room is done or waiting
          default: off_after_dry
          selector:
            select:
              options:
                - {label: "Fan to dry the coil after cooling, then off", value: off_after_dry}
                - {label: Fan only, value: fan_only}
                - {label: "Off", value: "off"}
        coil_dry_minutes:
          name: Coil dry time
          default: 10
          selector:
            number: {min: 1, max: 60, step: 1, unit_of_measurement: min}
        open_delay_seconds:
          name: Door or window open delay
          description: >-
            How long a room's doors and windows sensor must stay on before its head
            is turned off, so a door opened in passing doesn't stop the room.
          default: 60
          selector:
            number: {min: 0, max: 1800, step: 15, unit_of_measurement: s}
        close_delay_seconds:
          name: Door or window close delay
          description: >-
            How long a room's doors and windows must stay closed before a stopped
            head starts again, so a door opened over and over (carrying groceries
            in) doesn't restart it each time. A head that is still running keeps
            running. 0 restarts at once.
          default: 120
          selector:
            number: {min: 0, max: 1800, step: 15, unit_of_measurement: s}
        disabled_action:
          name: A disabled room's head
          default: "off"
          selector:
            select:
              options:
                - {label: Turn it off, value: "off"}
                - {label: Leave it alone, value: leave}
        drive_offset:
          name: Setpoint drive offset
          description: >-
            Cloud heads still run on their own thermistor. While a room runs, its
            head gets target plus this (heat) or minus this (cool), so it keeps
            running until your room sensor reaches target. 0 sends the target.
          default: 2.0
          selector:
            number: {min: 0, max: 6, step: 0.5, unit_of_measurement: "°"}
        setpoint_step:
          name: Setpoint step
          description: 1 for °F, 0.5 for °C.
          default: 1.0
          selector:
            number: {min: 0.1, max: 1, step: 0.1}
        clamp_min:
          name: Lowest setpoint
          default: 59
          selector:
            number: {min: 40, max: 90, step: 1, unit_of_measurement: "°"}
        clamp_max:
          name: Highest setpoint
          default: 88
          selector:
            number: {min: 50, max: 95, step: 1, unit_of_measurement: "°"}
    fan:
      name: Fan boost
      icon: mdi:fan
      collapsed: true
      input:
        fan_boost:
          name: Fan boost
          description: >-
            Speed the fan up the further a room is from target. Uses the head's own
            fan modes (minus auto) in the order it lists them, lowest first.
          default: true
          selector:
            boolean: {}
        fan_boost_max:
          name: Highest fan step to use
          description: 0 is the lowest listed speed. 4 is the most fan boost ever steps up.
          default: 4
          selector:
            number: {min: 0, max: 4, step: 1}
        fan_step:
          name: Degrees per fan step
          description: The fan steps up at 1, 2, 3, and 4 times this off target. 1 for °F, 0.5 for °C.
          default: 1.0
          selector:
            number: {min: 0.25, max: 3, step: 0.25, unit_of_measurement: "°"}
    seasons:
      name: Seasons (optional)
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        outdoor:
          name: Outdoor temperature
          description: A sensor, or a weather entity's temperature. Leave blank for no lockouts.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
                - domain: weather
        heat_lockout_above:
          name: No heating at or above
          default: 68
          selector:
            number: {min: 30, max: 100, step: 1, unit_of_measurement: "°"}
        heat_floor:
          name: Heat anyway below
          default: 58
          selector:
            number: {min: 30, max: 80, step: 1, unit_of_measurement: "°"}
        cool_lockout_below:
          name: No cooling at or below
          default: 50
          selector:
            number: {min: 0, max: 90, step: 1, unit_of_measurement: "°"}
        cool_ceiling:
          name: Cool anyway above
          default: 80
          selector:
            number: {min: 60, max: 100, step: 1, unit_of_measurement: "°"}
    health:
      name: Health and pacing
      icon: mdi:cloud-clock
      collapsed: true
      input:
        sensor_stale_minutes:
          name: Ignore a sensor quiet for
          description: Minutes since its last report before a room stops asking. 0 = never.
          default: 0
          selector:
            number: {min: 0, max: 1440, step: 5, unit_of_measurement: min}
        settle_seconds:
          name: Wait after sending commands
          description: >-
            Cloud heads report back slowly. After commands go out, runs that start
            during this wait are skipped, so the same command isn't re-sent before
            the head has reported.
          default: 90
          selector:
            number: {min: 0, max: 600, step: 15, unit_of_measurement: s}

mode: single
max_exceeded: silent

triggers:
  # One state_changed trigger per room entity. Unlike a state trigger, this one
  # stays valid when an optional room is left blank or cleared, which a state
  # trigger on an empty entity would turn into a broken automation.
