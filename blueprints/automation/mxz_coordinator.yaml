    - slot: 5
      head: !input room_5_head
      sensor: !input room_5_sensor
      target: !input room_5_target
      heat_to: !input room_5_heat_to
      cool_to: !input room_5_cool_to
      enable: !input room_5_enable
      open: !input room_5_open
    - slot: 6
      head: !input room_6_head
      sensor: !input room_6_sensor
      target: !input room_6_target
      heat_to: !input room_6_heat_to
      cool_to: !input room_6_cool_to
      enable: !input room_6_enable
      open: !input room_6_open
  rooms_cfg: "{{ slots | selectattr('head') | list }}"
  # Slots with something filled in but not a full room: a head, sensor, and
  # enable, plus either a target or a Heat to / Cool to pair (not both).
  incomplete: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for s in slots -%}
      {%- set filled = [s.head, s.sensor, s.target, s.heat_to, s.cool_to, s.enable, s.open] | select | list -%}
      {%- set single = s.target and not s.heat_to and not s.cool_to -%}
      {%- set dual = not s.target and s.heat_to and s.cool_to -%}
      {%- if filled and not (s.head and s.sensor and s.enable and (single or dual)) -%}
        {%- set ns.l = ns.l + [s.slot] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.l }}
  # Entities used twice. Targets, Heat to, and Cool to are checked as one pool.
  duplicates: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for keys in [['head'], ['sensor'], ['target', 'heat_to', 'cool_to'], ['enable']] -%}
      {%- set pool = namespace(l=[]) -%}
      {%- for key in keys -%}
        {%- set pool.l = pool.l + (rooms_cfg | map(attribute=key) | select | list) -%}
      {%- endfor -%}
      {%- for e in pool.l | unique -%}
        {%- if pool.l | select('eq', e) | list | length > 1 -%}{%- set ns.l = ns.l + [e] -%}{%- endif -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ ns.l }}
  coordinator_enable: !input coordinator_enable
  mode_helper: !input mode_helper
  drift: !input drift
  demand_threshold: !input demand_threshold
  dual_min_gap: !input dual_min_gap
  min_switch_seconds: !input min_switch_seconds
  resting_mode: !input resting_mode
  idle_action: !input idle_action
  coil_dry_minutes: !input coil_dry_minutes
  disabled_action: !input disabled_action
  open_delay_seconds: !input open_delay_seconds
  close_delay_seconds: !input close_delay_seconds
  drive_offset: !input drive_offset
  setpoint_step: !input setpoint_step
  clamp_min: !input clamp_min
  clamp_max: !input clamp_max
  fan_boost: !input fan_boost
  fan_boost_max: !input fan_boost_max
  fan_step: !input fan_step
  outdoor: !input outdoor
  heat_lockout_above: !input heat_lockout_above
  heat_floor: !input heat_floor
  cool_lockout_below: !input cool_lockout_below
  cool_ceiling: !input cool_ceiling
  sensor_stale_minutes: !input sensor_stale_minutes
  settle_seconds: !input settle_seconds
  config_ok: >-
    {{ rooms_cfg | length >= 1 and incomplete | length == 0 and duplicates | length == 0 }}
  # The plan: a port of logic.py's room_call, engage_with_latch, shared_mode,
  # fan_for_delta, and head_action. State between runs comes from entities:
  # the mode helper holds the shared mode and its last_changed is the switch
  # clock; a head in the shared mode is a room mid-run (the run-to-target
  # latch); a head's time in fan_only is the coil dry timer; and its current
  # fan_mode is the fan step.
  plan: >-
    {#- ht/ct are the heat side's and cool side's targets: Heat to and Cool to
        in a dual-setpoint room, the one target twice otherwise. -#}
    {%- macro call(t, ht, ct, band, en, ok, neutral, hl, hf, cl, cc) -%}
      {%- if not en -%}off
      {%- elif not ok -%}{{ neutral }}
      {%- else -%}
        {%- set hb = ht - band -%}
        {%- set ca = ct + band -%}
        {%- if hl -%}{%- set hb = [hb, hf] | min -%}{%- endif -%}
        {%- if cl -%}{%- set ca = [ca, cc] | max -%}{%- endif -%}
        {%- if t > ca -%}cool{%- elif t < hb -%}heat{%- else -%}{{ neutral }}{%- endif -%}
      {%- endif -%}
    {%- endmacro -%}
    {%- set ns = namespace(rooms=[], calls=[], parks=[], runs=[], od=none) -%}
    {%- if outdoor -%}
      {%- set ns.od = (state_attr(outdoor, 'temperature') if outdoor.startswith('weather.')
                       else states(outdoor)) | float(none) -%}
    {%- endif -%}
    {%- set hl = ns.od is not none and ns.od >= heat_lockout_above -%}
    {%- set cl = ns.od is not none and ns.od <= cool_lockout_below -%}
    {%- set band = [demand_threshold, drift] | max -%}
    {#- read each room and its demand -#}
    {%- for rc in (rooms_cfg if config_ok else []) -%}
      {%- set h = rc.head -%}
      {%- set hx = expand(h) -%}
      {%- set hs = hx[0] if hx else none -%}
      {%- set sid = rc.sensor -%}
      {%- set sx = expand(sid) -%}
      {%- set t = states(sid) | float(none) -%}
      {%- set dual = not rc.target -%}
      {%- set tgt = none if dual else states(rc.target) | float(none) -%}
      {%- set ht = states(rc.heat_to) | float(none) if dual else tgt -%}
      {%- set ct = states(rc.cool_to) | float(none) if dual else tgt -%}
      {%- set en = is_state(rc.enable, 'on') -%}
      {%- set head_ok = hs is not none and hs.state not in ['unknown', 'unavailable'] -%}
      {#- open: the room's doors/windows sensor has been on for the open delay.
          A shared group (an open-plan space) may serve several rooms. -#}
      {%- set ox = expand(rc.open) if rc.open else [] -%}
      {%- set oage = (now() - ox[0].last_changed).total_seconds() if ox else 0 -%}
      {%- set open = ox | length > 0 and ox[0].state == 'on' and oage >= open_delay_seconds | float(0) -%}
      {#- held: open but not yet for the open delay, or closed for less than the
          close delay, while the head isn't running. It doesn't start; a running
          head carries on. -#}
      {%- set held = ox | length > 0 and head_ok and hs.state not in ['heat', 'cool']
                     and ((ox[0].state == 'on' and not open)
                          or (ox[0].state == 'off' and oage < close_delay_seconds | float(0))) -%}
      {%- set why = 'head unavailable' if not head_ok
                    else 'no target' if ht is none or ct is none
                    else 'cool to is less than ' ~ dual_min_gap ~ ' above heat to'
                      if dual and ct - ht < dual_min_gap | float(0) - 0.000001
                    else 'sensor has no reading' if t is none else '' -%}
      {%- if not why and sensor_stale_minutes | float(0) > 0 and sx -%}
        {%- set quiet = (now() - (sx[0].last_reported or sx[0].last_updated)).total_seconds() / 60 -%}
        {%- if quiet > sensor_stale_minutes | float(0) -%}
          {%- set why = 'sensor quiet ' ~ (quiet | round(0) | int) ~ ' min' -%}
        {%- endif -%}
      {%- endif -%}
      {%- set ok = not why -%}
      {%- set demand = call(t, ht, ct, band, en and not open and not held, ok, 'neutral', hl, heat_floor, cl, cool_ceiling) | trim -%}
      {%- if demand in ['heat', 'cool'] -%}{%- set ns.calls = ns.calls + [demand] -%}{%- endif -%}
      {%- set ns.rooms = ns.rooms + [{'slot': rc.slot, 'head': h, 'sensor': sid,
                                      'target_entity': rc.target, 'heat_to_entity': rc.heat_to,
                                      'cool_to_entity': rc.cool_to, 'enable_entity': rc.enable,
                                      'open_entity': rc.open, 'open': open, 'held': held,
                                      'temp': t, 'dual': dual, 'target': tgt,
                                      'heat_to': ht, 'cool_to': ct, 'enabled': en,
                                      'ok': ok, 'head_ok': head_ok, 'problem': why,
                                      'demand': demand, 'state': hs.state if head_ok else none}] -%}
    {%- endfor -%}
    {#- shared mode -#}
    {%- set mx = expand(mode_helper) -%}
    {%- set cur = states(mode_helper) -%}
    {%- set cur = cur if cur in ['heat', 'cool'] else 'cool' -%}
    {%- set allowed = not mx or (now() - mx[0].last_changed).total_seconds() >= min_switch_seconds | float(0) -%}
    {%- set any_cool = 'cool' in ns.calls -%}
    {%- set any_heat = 'heat' in ns.calls -%}
    {%- set standoff = any_cool and any_heat -%}
    {%- set rest = resting_mode if resting_mode in ['heat', 'cool'] else cur -%}
    {%- set proposed = ns.calls[0] if standoff else 'cool' if any_cool else 'heat' if any_heat else rest -%}
    {%- set still = (cur == 'cool' and any_cool) or (cur == 'heat' and any_heat) -%}
    {%- set mode = proposed if proposed != cur and allowed and (standoff or not still) else cur -%}
    {#- engage, action, and commands per head -#}
    {%- set ns.out = [] -%}
    {%- for r in ns.rooms -%}
      {%- set h = r.head -%}
      {%- set prior = r.state if r.state in ['heat', 'cool'] else none -%}
      {%- if prior -%}
        {%- set raw = call(r.temp, r.heat_to, r.cool_to, 0, r.enabled and not r.open and not r.held, r.ok, 'satisfied', hl, heat_floor, cl, cool_ceiling) | trim -%}
        {%- set engage = raw if raw in [prior, 'off'] else 'satisfied' -%}
      {%- else -%}
        {%- set engage = call(r.temp, r.heat_to, r.cool_to, drift, r.enabled and not r.open and not r.held, r.ok, 'satisfied', hl, heat_floor, cl, cool_ceiling) | trim -%}
      {%- endif -%}
      {%- set modes = state_attr(h, 'hvac_modes') or [] -%}
      {%- set can_fan = 'fan_only' in modes -%}
      {%- set run = r.head_ok and r.enabled and not r.open and not r.held and engage == mode -%}
      {%- if not r.head_ok -%}
        {%- set act = 'skip' -%}
      {%- elif not r.enabled -%}
        {%- set act = 'leave' if disabled_action == 'leave' else 'off' -%}
      {%- elif r.open -%}
        {#- straight off, no coil dry: don't blow air out an open window -#}
        {%- set act = 'off' -%}
      {%- elif r.held -%}
        {#- left as it is (off after an opening, or drying) until the close delay ends -#}
        {%- set act = 'hold' -%}
      {%- elif run -%}
        {%- set act = mode -%}
      {%- elif idle_action == 'fan_only' and can_fan -%}
        {%- set act = 'fan_only' -%}
      {%- elif idle_action == 'off_after_dry' and can_fan and r.state == 'cool' -%}
        {%- set act = 'fan_only' -%}
      {%- elif idle_action == 'off_after_dry' and can_fan and r.state == 'fan_only'
              and (now() - expand(h)[0].last_changed).total_seconds() < coil_dry_minutes | float(0) * 60 -%}
        {%- set act = 'fan_only' -%}
      {%- else -%}
        {%- set act = 'off' -%}
      {%- endif -%}
      {%- set info = {'setpoint': none, 'fan': none} -%}
      {%- if act in ['off', 'fan_only'] and r.state != act -%}
        {%- set ns.parks = ns.parks + [{'entity': h, 'service': 'set_hvac_mode', 'data': {'hvac_mode': act}}] -%}
      {%- elif run -%}
        {%- if r.state != mode -%}
          {%- set ns.runs = ns.runs + [{'entity': h, 'service': 'set_hvac_mode', 'data': {'hvac_mode': mode}}] -%}
        {%- endif -%}
        {%- set s = setpoint_step | float(1) -%}
        {%- set lo = [clamp_min, state_attr(h, 'min_temp') | float(clamp_min)] | max -%}
        {%- set hi = [clamp_max, state_attr(h, 'max_temp') | float(clamp_max)] | min -%}
        {%- set want = r.heat_to + drive_offset if mode == 'heat' else r.cool_to - drive_offset -%}
        {%- set sp = ((([[want, lo] | max, hi] | min) / s) | round(0)) * s -%}
        {%- set cur_sp = state_attr(h, 'temperature') | float(none) -%}
        {%- if cur_sp is none or (cur_sp - sp) | abs >= s / 2 -%}
          {%- set ns.runs = ns.runs + [{'entity': h, 'service': 'set_temperature', 'data': {'temperature': sp}}] -%}
        {%- endif -%}
        {%- set fan = none -%}
        {%- if fan_boost -%}
          {%- set ladder = namespace(l=[]) -%}
          {%- for f in state_attr(h, 'fan_modes') or [] -%}
            {%- if f | string | lower != 'auto' -%}{%- set ladder.l = ladder.l + [f] -%}{%- endif -%}
          {%- endfor -%}
          {%- if ladder.l -%}
            {%- set top = [fan_boost_max | int(4), ladder.l | length - 1, 4] | min -%}
            {%- set cur_fan = state_attr(h, 'fan_mode') -%}
            {%- set f = namespace(i=0) -%}
            {%- for x in ladder.l -%}{%- if x == cur_fan -%}{%- set f.i = loop.index0 -%}{%- endif -%}{%- endfor -%}
            {%- set f.i = [f.i, top] | min -%}
            {#- how far outside Heat to..Cool to (off target, for one target) -#}
            {%- set delta = r.heat_to - r.temp if r.temp < r.heat_to
                            else r.temp - r.cool_to if r.temp > r.cool_to else 0 -%}
            {%- for k in range(5) -%}
              {%- if f.i < top and delta >= (f.i + 1) * fan_step -%}{%- set f.i = f.i + 1 -%}{%- endif -%}
            {%- endfor -%}
            {%- for k in range(5) -%}
              {%- if f.i > 0 and delta < (f.i - 0.5) * fan_step -%}{%- set f.i = f.i - 1 -%}{%- endif -%}
            {%- endfor -%}
            {%- set fan = ladder.l[f.i] -%}
            {%- if cur_fan != fan -%}
              {%- set ns.runs = ns.runs + [{'entity': h, 'service': 'set_fan_mode', 'data': {'fan_mode': fan}}] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endif -%}
        {%- set info = {'setpoint': sp, 'fan': fan} -%}
      {%- endif -%}
      {%- set ns.out = ns.out + [dict(r, engage=engage, action=act, **info)] -%}
    {%- endfor -%}
    {#- parks go first, so the outdoor unit is never asked for both directions.
        Output a dict, not tojson: HA reads variables back as Python literals. -#}
    {{ {'mode': mode, 'previous': cur, 'proposed': proposed, 'standoff': standoff,
        'mode_change_allowed': allowed, 'outdoor': ns.od, 'heat_lockout': hl,
        'cool_lockout': cl, 'rooms': ns.out, 'commands': ns.parks + ns.runs} }}

actions:
  - if: "{{ not config_ok }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: mxz_coordinator_blueprint
          title: MXZ Coordinator
          message: >-
            The automation is doing nothing until its rooms are fixed.
            {%- if incomplete %}
            Room {{ incomplete | join(', ') }}: each room needs a head, sensor,
            enable, and either a target or both Heat to and Cool to (not both
            kinds), or nothing at all.
            {%- endif %}
            {%- if duplicates %}
            Used by more than one room: {{ duplicates | join(', ') }}.
            {%- endif %}
            {%- if not rooms_cfg %}
            No room has a head.
            {%- endif %}
      - stop: Rooms are not set up correctly
  - condition: state
    entity_id: !input coordinator_enable
    state: "on"
  - if: "{{ plan.mode != states(mode_helper) }}"
    then:
      - action: input_select.select_option
        target:
          entity_id: !input mode_helper
        data:
          option: "{{ plan.mode }}"
  - repeat:
      for_each: "{{ plan.commands }}"
      sequence:
        - action: "climate.{{ repeat.item.service }}"
          target:
            entity_id: "{{ repeat.item.entity }}"
          data: "{{ repeat.item.data }}"
          continue_on_error: true
  - if: "{{ plan.commands | length > 0 }}"
    then:
      - delay:
          seconds: "{{ settle_seconds | int(0) }}"
