blueprint:
  name: MXZ Coordinator (cloud heads)
  description: >-
    One shared heat or cool mode for the heads on a Mitsubishi multi-split outdoor
    unit, decided from your room sensors. Rooms that want the other mode wait, the
    first room wins a standoff, and a room that reaches target steps aside.
    Ported from the core logic of the MXZ Coordinator integration
    (github.com/dkpnw/ha-mxz-coordinator) for heads reached through a cloud
    integration. Settings are in °F; on a °C system use about half for every band.


    **Up to six rooms.** Each room's head, temperature sensor, target, and enable
    are picked together in its own section. Room 1 has the highest priority;
    rooms 1 and 2 are required, and 3 to 6 are optional. For a dual-setpoint
    room, leave Target blank and pick Heat to and Cool to instead.


    Create an input_select with exactly the options `heat` and `cool` for the
    shared mode. You can also pick a mode on it yourself; the wait between
    switches restarts from that change.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    room_1:
      name: Room 1
      icon: mdi:numeric-1-box-outline
      description: "Highest priority: wins a heat-versus-cool standoff."
      input:
        room_1_head:
          name: Room 1 head
          description: The room's indoor unit.
          selector:
            entity:
              domain: climate
        room_1_sensor:
          name: Room 1 temperature sensor
          description: The sensor the room runs on.
          selector:
            entity:
              domain: sensor
              device_class: temperature
        room_1_target:
          name: Room 1 target
          description: >-
            An input_number holding the room's target. Leave it blank if the
            room uses Heat to and Cool to instead.
          default: ""
          selector:
            entity:
              domain: input_number
        room_1_heat_to:
          name: Room 1 heat to (dual setpoint)
          description: >-
            Optional, with Cool to, in place of Target: an input_number the room
            heats up to. Between Heat to and Cool to the room asks for nothing.
          default: ""
          selector:
            entity:
              domain: input_number
        room_1_cool_to:
          name: Room 1 cool to (dual setpoint)
          description: Optional, with Heat to, in place of Target. An input_number the room cools down to.
          default: ""
          selector:
            entity:
              domain: input_number
        room_1_enable:
          name: Room 1 enable
          description: An input_boolean that turns the room on or off.
          selector:
            entity:
              domain: input_boolean
        room_1_open:
          name: Room 1 doors and windows
          description: >-
            Optional. A binary_sensor that is on while a door or window is open,
            such as a group of the room's contact sensors. While it's on, the
            head is turned off and the room asks for nothing.
          default: ""
          selector:
            entity:
              domain: binary_sensor
    room_2:
      name: Room 2
      icon: mdi:numeric-2-box-outline
      description: Priority 2.
      input:
        room_2_head:
          name: Room 2 head
          description: The room's indoor unit.
          selector:
            entity:
              domain: climate
        room_2_sensor:
          name: Room 2 temperature sensor
          description: The sensor the room runs on.
          selector:
            entity:
              domain: sensor
              device_class: temperature
        room_2_target:
